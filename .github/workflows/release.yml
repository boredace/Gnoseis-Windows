name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Run the tests
        run: dotnet test tests/Gnoseis.Core.Tests

      # The build output, not the Publish target: Publish leaves out Gnoseis.pri and the app can't start.
      # Single-file and trimming stay off: WinUI 3 doesn't work reliably with either.
      - name: Build
        run: msbuild src/Gnoseis.App/Gnoseis.App.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true "/p:OutDir=$env:RUNNER_TEMP\app\"

      # Code signing starts with 1.0. Sign Gnoseis.exe and the project's own DLLs here, with a timestamp,
      # before they go into the zip.

      - name: Zip
        id: zip
        run: |
          $zip = "Gnoseis-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\app\*" -DestinationPath $zip
          $sha256 = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.zip }}

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.zip.outputs.zip }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $notes = (Get-Content .github/release-notes-template.md -Raw).Replace('{{VERSION}}', $version).Replace('{{SHA256}}', $env:SHA256)
          $notesFile = "$env:RUNNER_TEMP\release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8NoBOM
          $options = @('--draft', '--verify-tag', '--title', "Gnoseis for Windows $version", '--notes-file', $notesFile)
          # A label after the version (-beta.1) makes it a pre-release.
          if ($version.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME $env:ZIP @options
